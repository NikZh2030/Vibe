<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Форма отправки данных</title>
   <style>
     :root { --bg:#121212; --surface:#1e1e1e; --border:#2a2a2a; --input:#0f0f10; --text:#ffffff; --muted:#bbbbbb; --blue:#0d47a1; --blue-hover:#0b3b84; }

     * { box-sizing: border-box; }

     body {
       margin: 0;
       background: var(--bg);
       color: var(--text);
       font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Helvetica Neue", "Apple Color Emoji", "Segoe UI Emoji";
       display: flex;
       align-items: center;
       justify-content: center;
       min-height: 100vh;
       padding: 16px;
     }

     .modal {
       width: 100%;
       max-width: 420px;
       background: var(--surface);
       border: 1px solid var(--border);
       border-radius: 12px;
       box-shadow: 0 10px 30px rgba(0,0,0,0.35);
       padding: 24px;
     }

     .modal h1 {
       margin: 0 0 16px;
       font-size: 20px;
       font-weight: 600;
     }

     .field { margin-bottom: 14px; }

     label {
       display: block;
       margin-bottom: 6px;
       color: var(--muted);
       font-size: 14px;
     }

     input[type="text"],
     input[type="email"] {
       width: 100%;
       padding: 12px 14px;
       background: var(--input);
       border: 1px solid var(--border);
       color: var(--text);
       border-radius: 10px;
       outline: none;
       transition: border-color .2s ease, box-shadow .2s ease;
     }

     input:focus {
       border-color: var(--blue);
       box-shadow: 0 0 0 3px rgba(13,71,161,0.25);
     }

     .actions { margin-top: 12px; }

     .btn {
       width: 100%;
       background: var(--blue);
       color: #fff;
       border: none;
       border-radius: 10px;
       padding: 12px 16px;
       font-size: 16px;
       cursor: pointer;
       transition: background-color .2s ease, transform .05s ease;
     }

     .btn:hover:not(:disabled) { background: var(--blue-hover); }
     .btn:active:not(:disabled) { transform: translateY(1px); }
     .btn:disabled {
       background: #555;
       cursor: not-allowed;
       opacity: 0.7;
     }

     @media (max-width: 480px) {
       .modal { padding: 18px; border-radius: 10px; }
       .modal h1 { font-size: 18px; }
       .btn { font-size: 15px; padding: 11px 14px; }
     }

     @media (min-width: 900px) {
       .modal { max-width: 520px; padding: 28px; }
       .modal h1 { font-size: 22px; }
     }
   </style>
</head>
<body>
  <div class="modal" role="dialog" aria-labelledby="formTitle" aria-modal="true">
    <h1 id="formTitle">Форма отправки данных</h1>
    <form id="userForm" action="#" method="post" novalidate>
       <div class="field">
         <label for="lastName">Фамилия</label>
         <input id="lastName" name="lastName" type="text" required>
       </div>

       <div class="field">
         <label for="firstName">Имя</label>
         <input id="firstName" name="firstName" type="text" required>
       </div>

       <div class="field">
         <label for="email">Email</label>
         <input id="email" name="email" type="email" required>
       </div>

       <div class="actions">
         <button class="btn" type="submit">Отправить</button>
       </div>
     </form>
   </div>
   
   <script type="module">
     import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
     
     const supabaseUrl = 'https://puoafcbeteqeoucvxldn.supabase.co';
     // Используйте ваш Supabase anon key здесь
     const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1b2FmY2JldGVxZW91Y3Z4bGRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIzNTI0NTksImV4cCI6MjA3NzkyODQ1OX0.tZnugeNAeqHqA1l2oQFZ9kxxlmxDmz9POqv-L3jPCas'; // Замените на ваш ключ
     const supabase = createClient(supabaseUrl, supabaseKey);
     
     document.getElementById('userForm').addEventListener('submit', async (e) => {
       e.preventDefault();
       
       const lastName = e.target.lastName.value;
       const firstName = e.target.firstName.value;
       const email = e.target.email.value;
       
       const submitButton = e.target.querySelector('button[type="submit"]');
       const originalText = submitButton.textContent;
       submitButton.disabled = true;
       submitButton.textContent = 'Отправка...';
       
       try {
         const { data, error } = await supabase
           .from('users')
           .insert([{ lastName, firstName, email }]);
         
         if (error) {
           alert('Ошибка при сохранении данных: ' + error.message);
           submitButton.disabled = false;
           submitButton.textContent = originalText;
         } else {
           alert('Данные успешно сохранены');
           e.target.reset();
           submitButton.disabled = false;
           submitButton.textContent = originalText;
         }
       } catch (err) {
         alert('Ошибка при сохранении данных: ' + err.message);
         submitButton.disabled = false;
         submitButton.textContent = originalText;
       }
     });
   </script>
 </body>
 </html>
